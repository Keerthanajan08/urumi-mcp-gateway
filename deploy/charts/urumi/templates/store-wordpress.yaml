apiVersion: v1
kind: ConfigMap
metadata:
  name: wp-setup
  labels: {{- include "urumi.labels" (list . "wordpress") | nindent 4 }}
data:
  # Shared with stores created by the store provisioner (bonus), so every store bootstraps identically.
  wp-setup.sh: |
{{ .Files.Get "files/wp-setup.sh" | indent 4 }}
  create-api-keys.php: |
{{ .Files.Get "files/create-api-keys.php" | indent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-data
  labels: {{- include "urumi.labels" (list . "wordpress") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- include "urumi.pvcStorageClass" .Values.storage.className | nindent 2 }}
  resources:
    requests:
      storage: {{ .Values.storage.wordpress }}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  labels: {{- include "urumi.labels" (list . "wordpress") | nindent 4 }}
spec:
  selector: {{- include "urumi.selector" "wordpress" | nindent 4 }}
  ports:
    - { name: http, port: 80, targetPort: 80 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels: {{- include "urumi.labels" (list . "wordpress") | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }   # ReadWriteOnce volume: never two pods at once
  selector:
    matchLabels: {{- include "urumi.selector" "wordpress" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "urumi.labels" (list . "wordpress") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: wordpress
          image: {{ .Values.images.wordpress }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          # Record the image's WordPress version on the volume so the setup sidecar can bring the core files on the
          # PVC up to it (the official entrypoint only copies core files into an EMPTY volume).
          command: ["/bin/sh", "-c"]
          args:
            - php -r 'include "/usr/src/wordpress/wp-includes/version.php"; echo $wp_version;' > /var/www/html/.image-wp-version;
              exec docker-entrypoint.sh apache2-foreground
          ports: [{ name: http, containerPort: 80 }]
          env:
            {{- include "urumi.wpDbEnv" (dict "ctx" .) | nindent 12 }}
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', '{{ include "urumi.storeUrl" . }}');
                define('WP_SITEURL', '{{ include "urumi.storeUrl" . }}');
                define('FORCE_SSL_ADMIN', false);
                define('DISALLOW_FILE_EDIT', true);
                // Behind the Ingress (TLS terminates there) and for the in-cluster MCP pod: honour
                // X-Forwarded-Proto so WooCommerce accepts Basic-auth REST keys ("is_ssl()").
                if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $_SERVER['HTTPS'] = 'on'; }
          startupProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec: { command: ["test", "-f", "/var/www/html/.setup-complete"] }
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.resources.wordpress | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "FOWNER", "NET_BIND_SERVICE", "KILL"]   # apache binds :80 as root, then drops to www-data
          volumeMounts:
            - { name: wp-data, mountPath: /var/www/html }
        - name: wp-setup
          image: {{ .Values.images.wpcli }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["/bin/sh", "/scripts/wp-setup.sh"]
          env:
            {{- include "urumi.wpDbEnv" (dict "ctx" .) | nindent 12 }}
            - { name: SITE_URL, value: {{ include "urumi.storeUrl" . | quote }} }
            - { name: SITE_TITLE, value: {{ .Values.store.title | quote }} }
            - { name: WP_ADMIN_USER, value: {{ .Values.store.adminUser | quote }} }
            - { name: WP_ADMIN_EMAIL, value: {{ .Values.store.adminEmail | quote }} }
            - { name: CURRENCY, value: {{ .Values.store.currency | quote }} }
            - { name: COUNTRY, value: {{ .Values.store.country | quote }} }
            - { name: WC_VERSION, value: {{ .Values.store.woocommerceVersion | quote }} }
            - { name: HOME, value: /tmp }          # wp-cli cache; the container runs as uid 33 with no home dir
            - name: WP_ADMIN_PASSWORD
              valueFrom: {{- include "urumi.secretRef" (dict "ctx" . "key" "wp-admin-password") | nindent 16 }}
            - name: WC_CONSUMER_KEY
              valueFrom: {{- include "urumi.secretRef" (dict "ctx" . "key" "wc-consumer-key") | nindent 16 }}
            - name: WC_CONSUMER_SECRET
              valueFrom: {{- include "urumi.secretRef" (dict "ctx" . "key" "wc-consumer-secret") | nindent 16 }}
          resources: {{- toYaml .Values.resources.wpSetup | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 33
            runAsGroup: 33
            runAsNonRoot: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: wp-data, mountPath: /var/www/html }
            - { name: scripts, mountPath: /scripts, readOnly: true }
      volumes:
        - name: wp-data
          persistentVolumeClaim: { claimName: wordpress-data }
        - name: scripts
          configMap: { name: wp-setup }
