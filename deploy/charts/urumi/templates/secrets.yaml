{{- if .Values.secrets.create }}
{{- $ns := .Release.Namespace }}
{{- $ex := lookup "v1" "Secret" $ns .Values.secrets.name }}
{{- $dbRoot := include "urumi.rand" (list $ex "mariadb-root-password" 24) }}
{{- $dbPass := include "urumi.rand" (list $ex "mariadb-password" 24) }}
{{- $wpAdmin := include "urumi.rand" (list $ex "wp-admin-password" 20) }}
{{- $ck := include "urumi.rand" (list $ex "wc-consumer-key" 40) }}
{{- $cs := include "urumi.rand" (list $ex "wc-consumer-secret" 40) }}
{{- $wooTok := include "urumi.rand" (list $ex "woo-mcp-token" 32) }}
{{- $notesTok := include "urumi.rand" (list $ex "notes-mcp-token" 32) }}
{{- $utilsTok := include "urumi.rand" (list $ex "utils-mcp-token" 32) }}
{{- $pgPass := include "urumi.rand" (list $ex "postgres-password" 24) }}
{{- $encSeed := include "urumi.rand" (list $ex "gateway-encryption-seed" 32) }}
{{- $sess := include "urumi.rand" (list $ex "gateway-session-secret" 48) }}
{{- $adminPw := .Values.secrets.adminPassword | default (include "urumi.rand" (list $ex "bootstrap-admin-password" 16)) }}
{{- $seed := list
      (dict "slug" "woocommerce" "name" "WooCommerce Store" "url" (printf "http://woo-mcp.%s.svc.cluster.local:8000/mcp" $ns) "token" $wooTok)
      (dict "slug" "notes" "name" "Team Notes" "url" (printf "http://notes-mcp.%s.svc.cluster.local:8000/mcp" $ns) "token" $notesTok)
      (dict "slug" "utils" "name" "Utilities" "url" (printf "http://utils-mcp.%s.svc.cluster.local:8000/mcp" $ns) "token" $utilsTok) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels: {{- include "urumi.labels" (list . "secrets") | nindent 4 }}
type: Opaque
stringData:
  mariadb-root-password: {{ $dbRoot | quote }}
  mariadb-password: {{ $dbPass | quote }}
  wp-admin-password: {{ $wpAdmin | quote }}
  wc-consumer-key: {{ $ck | quote }}
  wc-consumer-secret: {{ $cs | quote }}
  woo-mcp-token: {{ $wooTok | quote }}
  notes-mcp-token: {{ $notesTok | quote }}
  utils-mcp-token: {{ $utilsTok | quote }}
  postgres-password: {{ $pgPass | quote }}
  database-url: {{ printf "postgresql+asyncpg://urumi:%s@postgres:5432/gateway" $pgPass | quote }}
  gateway-encryption-seed: {{ $encSeed | quote }}
  # Fernet key = url-safe base64 of 32 bytes
  gateway-encryption-key: {{ $encSeed | b64enc | replace "+" "-" | replace "/" "_" | quote }}
  gateway-session-secret: {{ $sess | quote }}
  bootstrap-admin-password: {{ $adminPw | quote }}
  llm-api-key: {{ .Values.secrets.llmApiKey | quote }}
  seed-servers: {{ toJson $seed | quote }}
{{- end }}
