apiVersion: v1
kind: Service
metadata:
  name: dashboard
  labels: {{- include "urumi.labels" (list . "dashboard") | nindent 4 }}
spec:
  selector: {{- include "urumi.selector" "dashboard" | nindent 4 }}
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels: {{- include "urumi.labels" (list . "dashboard") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "urumi.selector" "dashboard" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "urumi.labels" (list . "dashboard") | nindent 8 }}
    spec:
      {{- include "urumi.podSecurity" . | nindent 6 }}
      containers:
        - name: dashboard
          image: {{ .Values.images.dashboard }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          lifecycle:
            # Zero-downtime rollouts: keep serving while the endpoint is removed from Service/Ingress,
            # then let the server drain. Without this, a few requests hit a pod that is already shutting down.
            preStop: { exec: { command: ["sleep", "5"] } }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5   # let the CNI program NetworkPolicy for the new pod IP before traffic arrives
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources: {{- toYaml .Values.resources.dashboard | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101           # nginx-unprivileged
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: {} }
