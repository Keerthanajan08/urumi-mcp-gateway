{{- $tls := .Values.ingress.tls }}
{{- $redirect := and $tls.enabled (eq .Values.ingress.className "traefik") (.Capabilities.APIVersions.Has "traefik.io/v1alpha1") }}
{{- if $redirect }}
# With TLS on, plain http:// is redirected to https:// (cookies are Secure-only there, so a dashboard opened over
# http would never stay logged in). cert-manager's HTTP-01 challenges use their own Ingress and are unaffected.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
  labels: {{- include "urumi.labels" (list . "ingress") | nindent 4 }}
spec:
  redirectScheme: { scheme: https, permanent: true }
---
{{- end }}
# Public surface: ONLY the storefront and the dashboard host (/, /api, /mcp). Nothing else has an Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store
  labels: {{- include "urumi.labels" (list . "ingress") | nindent 4 }}
  {{- if or .Values.ingress.annotations $tls.enabled }}
  annotations:
    {{- with .Values.ingress.annotations }}{{ toYaml . | nindent 4 }}{{ end }}
    {{- if $tls.enabled }}
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer | quote }}
    {{- end }}
    {{- if $redirect }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-redirect-https@kubernetescrd" .Release.Namespace | quote }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts: [{{ include "urumi.storeHost" . | quote }}]
      secretName: {{ $tls.storeSecretName }}
  {{- end }}
  rules:
    - host: {{ include "urumi.storeHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: wordpress, port: { number: 80 } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  labels: {{- include "urumi.labels" (list . "ingress") | nindent 4 }}
  {{- if or .Values.ingress.annotations $tls.enabled }}
  annotations:
    {{- with .Values.ingress.annotations }}{{ toYaml . | nindent 4 }}{{ end }}
    {{- if $tls.enabled }}
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer | quote }}
    {{- end }}
    {{- if $redirect }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ printf "%s-redirect-https@kubernetescrd" .Release.Namespace | quote }}
    {{- end }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if $tls.enabled }}
  tls:
    - hosts: [{{ include "urumi.appHost" . | quote }}]
      secretName: {{ $tls.appSecretName }}
  {{- end }}
  rules:
    - host: {{ include "urumi.appHost" . | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: gateway, port: { number: 8000 } } }
          - path: /mcp
            pathType: Prefix
            backend: { service: { name: gateway, port: { number: 8000 } } }
          - path: /oauth                      # OAuth authorize/token/register (MCP authorization spec)
            pathType: Prefix
            backend: { service: { name: gateway, port: { number: 8000 } } }
          - path: /.well-known                # protected-resource + authorization-server metadata
            pathType: Prefix
            backend: { service: { name: gateway, port: { number: 8000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: dashboard, port: { number: 8080 } } }
