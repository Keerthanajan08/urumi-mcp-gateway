apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels: {{- include "urumi.labels" (list . "mariadb") | nindent 4 }}
spec:
  clusterIP: None
  selector: {{- include "urumi.selector" "mariadb" | nindent 4 }}
  ports:
    - { name: mysql, port: 3306, targetPort: 3306 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  labels: {{- include "urumi.labels" (list . "mariadb") | nindent 4 }}
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels: {{- include "urumi.selector" "mariadb" | nindent 6 }}
  template:
    metadata:
      labels: {{- include "urumi.labels" (list . "mariadb") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mariadb
          image: {{ .Values.images.mariadb }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          ports: [{ name: mysql, containerPort: 3306 }]
          env:
            - { name: MARIADB_DATABASE, value: wordpress }
            - { name: MARIADB_USER, value: wordpress }
            - name: MARIADB_PASSWORD
              valueFrom: {{- include "urumi.secretRef" (dict "ctx" . "key" "mariadb-password") | nindent 16 }}
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: {{- include "urumi.secretRef" (dict "ctx" . "key" "mariadb-root-password") | nindent 16 }}
          startupProbe:
            tcpSocket: { port: 3306 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h 127.0.0.1 -uroot -p\"$MARIADB_ROOT_PASSWORD\" --silent"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket: { port: 3306 }
            periodSeconds: 20
            failureThreshold: 6
          resources: {{- toYaml .Values.resources.mariadb | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- include "urumi.pvcStorageClass" .Values.storage.className | nindent 8 }}
        resources:
          requests:
            storage: {{ .Values.storage.mariadb }}
