name: ci
on: { push: { branches: [main] }, pull_request: {} }
jobs:
  python:
    runs-on: ubuntu-latest
    strategy: { matrix: { svc: [woo-mcp, demo-mcp, gateway] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r services/${{ matrix.svc }}/requirements-dev.txt
      - run: cd services/${{ matrix.svc }} && python -m pytest -q
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd services/dashboard && npm install && npm run build
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: lint + render every values combination
        run: |
          C=deploy/charts/urumi
          for v in values-local.yaml values-prod.yaml; do helm lint $C -f $C/$v; helm template urumi $C -n urumi -f $C/$v > /tmp/$v.out; done
          helm template urumi $C -n urumi -f $C/values-prod.yaml --set hosted.enabled=true --set hosted.apiServerCIDR=10.0.0.5/32 \
            --set 'hosted.allowedImagePrefixes={ghcr.io/acme/}' --set stores.enabled=true --set stores.apiServerCIDR=10.0.0.5/32 > /tmp/hosted.out
      - uses: docker://ghcr.io/yannh/kubeconform:latest
        with: { args: "-strict -ignore-missing-schemas -summary -kubernetes-version 1.31.0 /tmp/values-local.yaml.out /tmp/values-prod.yaml.out /tmp/hosted.out" }
  images:
    runs-on: ubuntu-latest
    needs: [python, dashboard, chart]
    steps:
      - uses: actions/checkout@v4
      - run: for s in woo-mcp demo-mcp gateway dashboard; do docker build -t urumi/$s:ci services/$s; done
      - uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: urumi/gateway:ci, severity: "CRITICAL,HIGH", exit-code: "0" }
